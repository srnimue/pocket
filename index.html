<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5efff" />
  <title>Prompt Pocket</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">PROMPT LIBRARY</div>
        <h1>Prompt Pocket</h1>
      </div>
      <button class="icon-btn" id="openSettings" aria-label="設定">⚙︎</button>
    </header>

    <main>
      <section class="search-row">
        <label class="search-box">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="タイトル・タグ・本文を検索" autocomplete="off" />
        </label>
      </section>

      <section class="category-strip-wrap">
        <div class="category-strip" id="categoryStrip"></div>
      </section>

      <section class="toolbar">
        <div class="count" id="itemCount">0件</div>
        <div class="toolbar-actions">
          <button class="ghost-btn" id="toggleFavorites">♡ お気に入り</button>
          <div class="view-switch" aria-label="表示切替">
            <button class="view-btn" id="gridViewBtn" type="button" aria-label="カード表示" title="カード表示">▦</button>
            <button class="view-btn" id="listViewBtn" type="button" aria-label="リスト表示" title="リスト表示">☰</button>
          </div>
        </div>
      </section>

      <section class="card-grid" id="cardGrid"></section>
      <div class="empty-state hidden" id="emptyState">
        <div class="empty-icon">✦</div>
        <p>まだプロンプトがありません。</p>
        <button class="primary-btn" id="emptyAdd">最初のプロンプトを追加</button>
      </div>
    </main>

    <button class="fab" id="addPrompt" aria-label="プロンプトを追加">＋</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog class="sheet" id="editDialog">
    <form method="dialog" id="promptForm">
      <div class="sheet-head">
        <button type="button" class="text-btn" id="cancelEdit">キャンセル</button>
        <h2 id="formTitle">プロンプトを追加</h2>
        <button type="submit" class="text-btn strong">保存</button>
      </div>
      <div class="sheet-body">
        <input type="hidden" id="editingId" />
        <label class="field">
          <span>タイトル <b>*</b></span>
          <input id="titleInput" required maxlength="80" placeholder="例：目隠れ前髪" />
        </label>
        <label class="field">
          <span>カテゴリ</span>
          <select id="categoryInput"></select>
        </label>
        <label class="field">
          <span>タグ</span>
          <input id="tagsInput" placeholder="男, 目隠れ, 銀髪" />
          <small>カンマ区切りで入力</small>
        </label>
        <label class="field">
          <span>プロンプト <b>*</b></span>
          <textarea id="promptInput" required rows="8" placeholder="1boy, solo, ..."></textarea>
        </label>
        <label class="field">
          <span>ネガティブプロンプト</span>
          <textarea id="negativeInput" rows="5" placeholder="worst quality, ..."></textarea>
        </label>
        <label class="field">
          <span>モデル / メモ</span>
          <input id="modelInput" placeholder="例：PixAI / SDXL / TSUBAKI2" />
        </label>
        <label class="field">
          <span>参考画像</span>
          <input id="imageInput" type="file" accept="image/*" />
          <small>端末内に保存されます。大きい画像は自動縮小します。</small>
        </label>
        <div class="image-preview-wrap hidden" id="imagePreviewWrap">
          <img id="imagePreview" alt="参考画像プレビュー" />
          <button type="button" class="danger-link" id="removeImage">画像を削除</button>
        </div>
      </div>
      <div class="sheet-footer edit-only hidden" id="editOnlyActions">
        <button type="button" class="danger-btn" id="deletePrompt">このプロンプトを削除</button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="detailDialog">
    <div class="sheet-head">
      <button type="button" class="text-btn" id="closeDetail">閉じる</button>
      <h2>詳細</h2>
      <button type="button" class="text-btn strong" id="editFromDetail">編集</button>
    </div>
    <div class="sheet-body" id="detailBody"></div>
  </dialog>

  <dialog class="sheet" id="settingsDialog">
    <div class="sheet-head">
      <button type="button" class="text-btn" id="closeSettings">閉じる</button>
      <h2>設定</h2>
      <span class="head-spacer"></span>
    </div>
    <div class="sheet-body">
      <section class="settings-card">
        <h3>カテゴリ管理</h3>
        <div id="categoryManager" class="category-manager"></div>
        <div class="inline-add">
          <input id="newCategoryInput" maxlength="20" placeholder="新しいカテゴリ" />
          <button class="small-btn" id="addCategoryBtn" type="button">追加</button>
        </div>
      </section>

      <section class="settings-card">
        <h3>バックアップ</h3>
        <p>登録データをJSONで書き出し・復元できます。</p>
        <div class="settings-actions">
          <button class="secondary-btn" id="exportBtn" type="button">JSONを書き出す</button>
          <label class="secondary-btn file-label">JSONを読み込む<input id="importInput" type="file" accept="application/json,.json" /></label>
        </div>
      </section>

      <section class="settings-card subtle">
        <h3>保存について</h3>
        <p>データはこのブラウザのlocalStorageに保存され、外部には送信されません。ブラウザデータ削除などで消える可能性があるため、定期的なJSONバックアップ推奨です。</p>
      </section>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
